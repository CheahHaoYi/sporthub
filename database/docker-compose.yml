services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sporthub}
      POSTGRES_USER: ${POSTGRES_USER:-sporthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sporthub_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sporthub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sporthub} -d ${POSTGRES_DB:-sporthub}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sporthub_postgres_data:
