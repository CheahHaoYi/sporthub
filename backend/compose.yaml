services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sporthub
      POSTGRES_USER: sporthub
      POSTGRES_PASSWORD: sporthub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporthub -d sporthub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sporthub-postgres-data:/var/lib/postgresql/data

volumes:
  sporthub-postgres-data:
