name: Nightly Regression
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: sporthub, POSTGRES_USER: sporthub, POSTGRES_PASSWORD: sporthub }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sporthub -d sporthub"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build backend and test suite
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/sporthub
          DATABASE_USERNAME: sporthub
          DATABASE_PASSWORD: sporthub
          DATABASE_MIGRATION_LOCATION: filesystem:../database/migrations
          JWT_SIGNING_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: mvn --batch-mode verify
      - name: Run API smoke and regression suite
        working-directory: qa/automation
        env:
          API_BASE_URL: http://localhost:8080/api/v1
        run: |
          cd ../../backend
          nohup mvn spring-boot:run > /tmp/sporthub.log 2>&1 &
          cd ../qa/automation
          for attempt in $(seq 1 60); do curl --fail http://localhost:8080/actuator/health && break; sleep 2; done
          mvn --batch-mode test -Dgroups="api regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            qa/automation/target/surefire-reports
  browser-and-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: browser-actions/setup-chrome@v1
      - name: Explain required deployed environment
        run: echo 'UI and JMeter regression are run only when corresponding environment/configuration is provided.'
